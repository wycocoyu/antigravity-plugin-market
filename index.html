<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Store · 反重力精选插件市场</title>
  <meta name="description" content="精选 Google Antigravity (AGY) 桌面客户端插件市场：上下文看板、皮肤美化、中文汉化、ACP 协议桥接与效率侧边栏。" />
  <meta property="og:title" content="Antigravity Store · 反重力精选插件市场" />
  <meta property="og:description" content="Curated Antigravity (AGY) Plugin Store: context dashboards, themes, zh-CN localization, ACP bridges & sidebar tools." />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#" class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 19.5h20L12 2z" />
            <path d="M12 9v5" />
            <circle cx="12" cy="16.5" r="0.5" fill="currentColor" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title" data-i18n="siteTitle">Antigravity Store</span>
          <span class="brand-badge">DIRECTORY</span>
        </div>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索插件、皮肤、汉化、ACP、上下文..." autocomplete="off" />
        <kbd class="kbd-hint" id="kbdHint">⌘K</kbd>
      </div>

      <div class="topbar-actions">
        <button id="langToggle" class="ghost-btn" type="button" title="切换语言">EN</button>
        <button id="themeToggle" class="ghost-btn" type="button" title="切换深浅模式" aria-label="Toggle theme">☀️</button>
        <a class="primary-btn" href="https://github.com/wycocoyu/antigravity-plugin-market/issues/new?template=submit-plugin.yml" target="_blank" rel="noopener noreferrer" data-i18n="submitPlugin">+ 投稿插件</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-top">
        <span class="hero-pill">
          <span class="pulse-dot"></span>
          <span data-i18n="heroPill">Curated for Antigravity Desktop & CLI</span>
        </span>
      </div>
      <h1 data-i18n="heroTitle">发现并安装好用的反重力插件</h1>
      <p class="hero-desc" data-i18n="heroDesc">收录社区高频使用的上下文看板、暖色皮肤、中文汉化、ACP 协议桥接与效率侧边栏插件，附带真实 GitHub Star 与一键安装指令。</p>
      <div class="hero-meta" id="heroStats"></div>
    </section>

    <section class="spotlight-section" id="spotlightSection">
      <div class="section-head">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span data-i18n="spotlightTitle">站长精选 · Editors' Spotlight</span>
        </h2>
        <span class="section-sub" data-i18n="spotlightSub">装机必看核心插件</span>
      </div>
      <div class="spotlight-grid" id="spotlightGrid"></div>
    </section>

    <section class="directory-section">
      <div class="controls-row">
        <nav class="category-bar" id="categoryBar" aria-label="插件分类"></nav>
        <div class="sort-wrap">
          <span class="result-count" id="resultCount"></span>
          <select id="sortSelect" aria-label="排序方式">
            <option value="featured" data-i18n="sortFeatured">精选优先</option>
            <option value="stars" data-i18n="sortStars">Star 最高</option>
            <option value="name" data-i18n="sortName">名称 A-Z</option>
          </select>
        </div>
      </div>

      <div class="plugin-grid" id="pluginGrid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span id="footerNote"></span>
      <div class="footer-links">
        <a href="https://github.com/wycocoyu/antigravity-plugin-market" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
        <a href="https://x.com/wycocoyu" target="_blank" rel="noopener noreferrer">X / Twitter</a>
      </div>
    </div>
  </footer>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">ESC</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden>已复制安装命令</div>

  <script src="app.js?v=3"></script>
</body>
</html>
