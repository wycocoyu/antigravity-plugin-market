<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Plugins Market · 反重力插件市场</title>
  <meta name="description" content="精选 Google Antigravity (AGY) 桌面客户端插件市场：上下文看板、皮肤美化、中文汉化、ACP 协议桥接与效率侧边栏。" />
  <meta property="og:title" content="Antigravity Plugins Market · 反重力插件市场" />
  <meta property="og:description" content="Curated marketplace for Google Antigravity (AGY) plugins: context dashboards, themes, zh-CN localization, ACP bridges & sidebar tools." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#" class="brand" id="brandLink">
        <span class="brand-logo" aria-hidden="true">A</span>
        <div class="brand-text">
          <span class="brand-title" data-i18n="siteTitle">Antigravity Store</span>
          <span class="brand-sub" data-i18n="siteSub">反重力第三方精选插件市场</span>
        </div>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索插件、皮肤、汉化、ACP、上下文..." autocomplete="off" />
      </div>

      <div class="topbar-actions">
        <button id="langToggle" class="icon-btn" type="button" title="切换语言">EN</button>
        <button id="themeToggle" class="icon-btn" type="button" title="切换深浅主题">🌙</button>
        <a id="submitBtn" class="submit-btn" href="https://github.com/wycocoyu/antigravity-plugin-market/issues/new?template=submit-plugin.yml" target="_blank" rel="noopener noreferrer" data-i18n="submitPlugin">+ 投稿插件</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <span class="hero-pill" data-i18n="heroPill">Curated for Antigravity Desktop & CLI</span>
        <h1 data-i18n="heroTitle">一站发现好用的反重力插件</h1>
        <p data-i18n="heroDesc">收录社区高频使用的上下文监控、暖色皮肤、中文汉化、ACP 协议桥接与效率增强插件，全部附带真实 Star 数与一键安装指令。</p>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </section>

    <nav class="category-bar" id="categoryBar" aria-label="插件分类"></nav>

    <section class="toolbar">
      <div class="result-count" id="resultCount"></div>
      <div class="sort-wrap">
        <label for="sortSelect" data-i18n="sortLabel">排序：</label>
        <select id="sortSelect">
          <option value="featured" data-i18n="sortFeatured">站长精选优先</option>
          <option value="stars" data-i18n="sortStars">Star 数最高</option>
          <option value="name" data-i18n="sortName">名称 A-Z</option>
        </select>
      </div>
    </section>

    <section class="plugin-grid" id="pluginGrid"></section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p id="footerNote"></p>
      <div class="footer-links">
        <a href="https://github.com/wycocoyu/antigravity-plugin-market" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://x.com/wycocoyu" target="_blank" rel="noopener noreferrer">X / Twitter</a>
      </div>
    </div>
  </footer>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden>已复制安装命令</div>

  <script src="app.js"></script>
</body>
</html>
